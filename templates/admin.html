<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Panel Administrativo
    </title>

    <!-- BOOTSTRAP miguel gay -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ESTILOS -->

    <style>

        body{
            background: white;
            color: white;
        }

        .header{
            background: #111827;
            padding: 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
        }

        .titulo{
            font-size: 35px;
            font-weight: bold;
        }

        .card{
            border: none;
            border-radius: 15px;
            background: #1e293b;
            color: white;
        }

        .table{
            color: white;
        }

        .table thead{
            background: #2563eb;
        }

        .badge-pendiente{
            background: #f59e0b;
        }

        .badge-atendido{
            background: #22c55e;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <div class="titulo">

            ⚙️ Panel Administrativo

        </div>

    </div>

    <div class="container">

        <!-- FILTRO -->

        <div class="card shadow-lg p-4 mb-5">

            <form method="GET" action="/admin">

                <div class="row align-items-end">

                    <div class="col-md-6">

                        <label class="form-label">

                            Filtrar por estado

                        </label>

                        <select
                            name="filtro"
                            class="form-control"
                        >

                            <option
                                {% if filtro == "Todos" %}
                                selected
                                {% endif %}
                            >
                                Todos
                            </option>

                            <option
                                {% if filtro == "Pendiente" %}
                                selected
                                {% endif %}
                            >
                                Pendiente
                            </option>

                            <option
                                {% if filtro == "Atendido" %}
                                selected
                                {% endif %}
                            >
                                Atendido
                            </option>

                        </select>

                    </div>

                    <div class="col-md-3">

                        <button
                            class="btn btn-primary w-100"
                        >

                            Aplicar Filtro

                        </button>

                    </div>

                </div>

            </form>

        </div>

        <!-- TABLA -->

        <div class="card shadow-lg p-4">

            <h3 class="mb-4">

                📋 Reportes Ciudadanos

            </h3>

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead>

                        <tr>

                            <th>
                                Título
                            </th>

                            <th>
                                Dependencia
                            </th>

                            <th>
                                Estado
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for reporte in reportes %}

                        <tr>

                            <td>

                                {{ reporte.titulo }}

                            </td>

                            <td>

                                {{ reporte.dependencia }}

                            </td>

                            <td>

                                {% if reporte.estado == "Pendiente" %}

                                    <span class="badge badge-pendiente">

                                        Pendiente

                                    </span>

                                {% else %}

                                    <span class="badge badge-atendido">

                                        Atendido

                                    </span>

                                {% endif %}

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</body>

</html>
