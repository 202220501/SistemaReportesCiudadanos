<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: white;
            color: white;
        }

        .header {
            background: #111827;
            padding: 25px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.4);
        }

        .titulo {
            font-size: 35px;
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 15px;
            background: #1e293b;
            color: white;
        }

        .table {
            color: white;
        }

        .table thead {
            background: #2563eb;
        }

        .badge-pendiente {
            background: #f59e0b;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .badge-atendido {
            background: #22c55e;
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="titulo">
            ⚙️ Panel Administrativo
        </div>
    </div>

    <div class="container">

        <div class="card shadow-lg p-4 mb-5">
            <form method="GET" action="/admin">
                <div class="row align-items-end">
                    <div class="col-md-6">
                        <label class="form-label">Filtrar por estado</label>
                        <select name="filtro" class="form-control">
                            <option value="Todos" {% if filtro == "Todos" %} selected {% endif %}>Todos</option>
                            <option value="Pendiente" {% if filtro == "Pendiente" %} selected {% endif %}>Pendiente</option>
                            <option value="Atendido" {% if filtro == "Atendido" %} selected {% endif %}>Atendido</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100">Aplicar Filtro</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card shadow-lg p-4">
            <h3 class="mb-4">📋 Reportes Ciudadanos</h3>
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>Tipo de Reporte</th>
                            <th>Ubicación</th>
                            <th>Prioridad</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for reporte in reportes %}
                        <tr>
                            <td>{{ reporte.tipo_reporte }}</td>
                            <td>{{ reporte.ubicacion }}</td>
                            <td>{{ reporte.prioridad }}</td>
                            <td>
                                {% if reporte.estado == "Pendiente" %}
                                    <span class="badge badge-pendiente">Pendiente</span>
                                {% else %}
                                    <span class="badge badge-atendido">Atendido</span>
                                {% endif %}
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</body>
</html>
