<!DOCTYPE html>
<html>

<head>
    <title>Registro</title>
</head>

<body>

    <h1>Registro de Usuarios</h1>

    <form method="POST">

        <input type="text"
               name="nombre"
               placeholder="Nombre"
               required>
        <br><br>

        <input type="email"
               name="correo"
               placeholder="Correo"
               required>
        <br><br>

        <input type="password"
               name="password"
               placeholder="Contraseña"
               required>
        <br><br>

        <button type="submit">
            Registrarse
        </button>

    </form>

    <br>

    <a href="/login">
        Ir al Login
    </a>

</body>

</html>
