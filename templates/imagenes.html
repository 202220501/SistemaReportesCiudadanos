<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Módulo de Imágenes

    </title>

    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- ESTILOS -->

    <style>

        body{
            background: #f1f5f9;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header{
            background: #0f172a;
            color: white;
            padding: 25px;
            text-align: center;
            margin-bottom: 40px;
        }

        .titulo{
            font-size: 35px;
            font-weight: bold;
        }

        .subtitulo{
            color: #cbd5e1;
        }

        .card{
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .preview-img{
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #cbd5e1;
            padding: 5px;
            background: white;
        }

        .btn-subir{
            width: 100%;
            height: 50px;
            font-size: 18px;
            font-weight: bold;
        }

        .btn-eliminar{

            position: absolute;

            top: 10px;

            right: 10px;

            width: 35px;

            height: 35px;

            border-radius: 50%;

            font-weight: bold;

            z-index: 100;

            padding: 0;

        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <div class="titulo">

            📸 Sistema de Evidencias Ciudadanas 📸

        </div>

        <div class="subtitulo">

            Gestión de imágenes y evidencias

        </div>

    </div>

    <div class="container">

        <!-- ALERTAS -->

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}

                {% for categoria, mensaje in messages %}

                    <div class="alert alert-{{ categoria }} alert-dismissible fade show">

                        {{ mensaje }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                        ></button>

                    </div>

                {% endfor %}

            {% endif %}
        {% endwith %}

        <!-- FORMULARIO -->

        <div class="card shadow-lg p-4 mb-5">

            <h3 class="mb-4">

                Subir Evidencias

            </h3>

            <form
                action="/imagenes"
                method="POST"
                enctype="multipart/form-data"
            >

                <!-- INPUT FILE -->

                <div class="mb-3">

                    <label class="form-label">

                        Selecciona imágenes

                    </label>

                    <input
                        type="file"
                        name="imagenes"
                        id="imagenes"
                        class="form-control"
                        multiple
                        accept=".png,.jpg,.jpeg"
                        onchange="previewImages(event)"
                        required
                    >

                </div>

                <!-- PREVIEW -->

                <div
                    class="row mb-4"
                    id="preview-container"
                >

                </div>

                <!-- BOTON -->

                <button
                    type="submit"
                    class="btn btn-success btn-subir"
                >

                    ☁ Subir Evidencias

                </button>

            </form>

        </div>

    </div>

    <!-- SCRIPT -->

    <script>

        let archivosSeleccionados = [];

        function previewImages(event){

            const nuevosArchivos =
                Array.from(event.target.files);

            archivosSeleccionados = [

                ...archivosSeleccionados,

                ...nuevosArchivos

            ];

            renderPreview();

        }

        function renderPreview(){

            const container =
                document.getElementById(
                    "preview-container"
                );

            container.innerHTML = "";

            archivosSeleccionados.forEach(

                function(file,index){

                    const reader =
                        new FileReader();

                    reader.onload =
                    function(e){

                        const div =
                            document.createElement(
                                "div"
                            );

                        div.className =
                            "col-md-3 mb-3";

                        div.innerHTML = `
                        
                        <div class="card shadow-sm position-relative">

                            <button
                                type="button"
                                class="btn btn-danger btn-eliminar"
                                onclick="eliminarImagen(${index})"
                            >

                                ✖

                            </button>

                            <img
                                src="${e.target.result}"
                                class="preview-img"
                            >

                            <div class="card-body text-center">

                                <small>

                                    ${file.name}

                                </small>

                            </div>

                        </div>

                        `;

                        container.appendChild(div);

                    }

                    reader.readAsDataURL(file);

                }

            );

            actualizarInput();

        }

        function eliminarImagen(index){

            archivosSeleccionados.splice(
                index,
                1
            );

            renderPreview();

        }

        function actualizarInput(){

            const dataTransfer =
                new DataTransfer();

            archivosSeleccionados.forEach(

                function(file){

                    dataTransfer.items.add(
                        file
                    );

                }

            );

            document.getElementById(
                "imagenes"
            ).files = dataTransfer.files;

        }

    </script>

    <!-- BOOTSTRAP JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
