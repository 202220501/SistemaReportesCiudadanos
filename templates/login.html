<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
</head>

<body>

    <h1>Iniciar Sesión</h1>

    <form method="POST">

        <input type="email"
               name="correo"
               placeholder="Correo"
               required>
        <br><br>

        <input type="password"
               name="password"
               placeholder="Contraseña"
               required>
        <br><br>

        <button type="submit">
            Ingresar
        </button>

    </form>

    <br>

    <a href="/registro">
        Registrarse
    </a>

    <p>{{ mensaje }}</p>

</body>

</html>
