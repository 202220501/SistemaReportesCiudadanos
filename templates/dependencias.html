<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dependencias</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #eef2f7;
        }

        .header {
            background-color: #0f172a;
            color: white;
            padding: 15px;
            border-radius: 8px;
        }

        .card {
            border-radius: 12px;
        }

        .btn {
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container mt-4">

    <!-- HEADER -->
    <div class="header mb-4">
        <h3>🏢 Gestión de Dependencias</h3>
        <p class="mb-0">Administración de dependencias del sistema</p>
    </div>

    <!-- FORMULARIO -->
    <div class="card shadow-lg mb-4">
        <div class="card-header bg-primary text-white">
            Registrar dependencia
        </div>

        <div class="card-body">

            <form method="POST" action="/dependencias">

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Zona</label>
                        <input type="text" name="zona" class="form-control" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Tipo de servicio</label>
                        <input type="text" name="tipo_servicio" class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success">
                    Guardar
                </button>

            </form>

        </div>
    </div>

    <!-- TABLA -->
    <div class="card shadow-lg">
        <div class="card-header bg-dark text-white">
            Lista de dependencias
        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-striped text-center">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Zona</th>
                        <th>Tipo de Servicio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    {% for dep in dependencias %}
                    <tr>
                        <td>{{ dep.id_dependencia }}</td>
                        <td>{{ dep.nombre }}</td>
                        <td>{{ dep.zona }}</td>
                        <td>{{ dep.tipo_servicio }}</td>
                        <td>

                            <a href="/eliminar_dependencia/{{ dep.id_dependencia }}"
                               class="btn btn-danger btn-sm">
                                Eliminar
                            </a>

                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
