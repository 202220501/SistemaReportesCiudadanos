<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Auditoría y Seguridad
    </title>

    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body{
            background: #eef2f7;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header{
            background: #0f172a;
            color: white;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo{
            font-size: 40px;
            font-weight: bold;
        }

        .card{
            border: none;
            border-radius: 15px;
        }

        .footer{
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <div class="titulo">

            🔐 Auditoría y Seguridad

        </div>

    </div>

    <div class="container">

        <!-- TABLA -->

        <div class="card shadow-lg p-4">

            <h2 class="mb-4">

                Bitácora del Sistema

            </h2>

            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover"
                >

                    <thead class="table-dark">

                        <tr>

                            <th>
                                Usuario
                            </th>

                            <th>
                                Acción
                            </th>

                            <th>
                                Módulo
                            </th>

                            <th>
                                Descripción
                            </th>

                            <th>
                                Fecha
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for evento in eventos %}

                        <tr>

                            <td>
                                {{ evento.usuario }}
                            </td>

                            <td>
                                {{ evento.accion }}
                            </td>

                            <td>
                                {{ evento.modulo }}
                            </td>

                            <td>
                                {{ evento.descripcion }}
                            </td>

                            <td>
                                {{ evento.fecha }}
                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- FOOTER -->

    <div class="footer">

        © 2026 Sistema Reportes Ciudadanos

    </div>

</body>

</html>
