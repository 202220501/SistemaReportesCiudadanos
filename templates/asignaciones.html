<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asignación de Reportes</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background-color: #eef2f7;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header{
            background-color: #0f172a;
            color: white;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.15);
        }

        .header h1{
            margin: 0;
        }

        .card{
            border: none;
            border-radius: 15px;
        }

        .estado{
            padding: 6px 14px;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        .pendiente{
            background-color: #ffc107;
            color: black;
        }

        .asignado{
            background-color: #198754;
        }

        .btn-asignar{
            background-color: #0d6efd;
            color: white;
        }

        .btn-asignar:hover{
            background-color: #0b5ed7;
            color: white;
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <div class="container">

            <h1>
                <i class="bi bi-clipboard-check"></i>
                Asignación de Reportes
            </h1>

            <p>
                Gestión y asignación de reportes ciudadanos a administradores.
            </p>

        </div>

    </div>

    <!-- CONTENIDO -->

    <div class="container">

        <!-- CARDS -->

        <div class="row mb-4">

            <div class="col-md-4 mb-3">

                <div class="card shadow-lg p-4">

                    <h2 class="text-primary">120</h2>

                    <p>
                        Reportes Registrados
                    </p>

                </div>

            </div>

            <div class="col-md-4 mb-3">

                <div class="card shadow-lg p-4">

                    <h2 class="text-success" id="contadorAsignados">87</h2>

                    <p>
                        Reportes Asignados
                    </p>

                </div>

            </div>

            <div class="col-md-4 mb-3">

                <div class="card shadow-lg p-4">

                    <h2 class="text-warning" id="contadorPendientes">33</h2>

                    <p>
                        Pendientes
                    </p>

                </div>

            </div>

        </div>

        <!-- BUSCADOR -->

        <div class="card shadow-lg p-4 mb-4">

            <label class="form-label">
                Buscar Reporte
            </label>

            <input 
                type="text"
                class="form-control"
                placeholder="Ejemplo: Alumbrado, Baches, Agua..."
            >

        </div>

        <!-- TABLA -->

        <div class="card shadow-lg p-4">

            <h4 class="mb-4">

                <i class="bi bi-table"></i>
                Lista de Reportes

            </h4>

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Ciudadano</th>
                            <th>Problema</th>
                            <th>Zona</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Acción</th>

                        </tr>

                    </thead>

                    <tbody id="tablaReportes">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- SCRIPT -->

    <script>

    const ciudadanos = [
        "Juan Pérez",
        "María López",
        "Carlos Ramírez",
        "Ana Torres",
        "Luis Hernández",
        "Fernanda Cruz",
        "Pedro Sánchez",
        "Daniela Flores"
    ];

    const problemas = [
        "Baches",
        "Fuga de agua",
        "Alumbrado público",
        "Basura acumulada",
        "Semáforo dañado",
        "Cableado peligroso",
        "Pavimento roto"
    ];

    const zonas = [
        "Centro",
        "Zona Norte",
        "Zona Sur",
        "Ecatepec",
        "San Cristóbal",
        "Las Américas"
    ];

    const tabla = document.getElementById("tablaReportes");

    // CONTADORES

    let asignados = 87;
    let pendientes = 33;

    const contadorAsignados = document.getElementById("contadorAsignados");
    const contadorPendientes = document.getElementById("contadorPendientes");

    // GENERAR FILAS

    for(let i = 1; i <= 100; i++){

        let ciudadano = ciudadanos[Math.floor(Math.random() * ciudadanos.length)];

        let problema = problemas[Math.floor(Math.random() * problemas.length)];

        let zona = zonas[Math.floor(Math.random() * zonas.length)];

        let asignado = Math.random() > 0.4;

        let estadoTexto = asignado ? "Asignado" : "Pendiente";

        let estadoClase = asignado ? "asignado" : "pendiente";

        let fila = `

        <tr>

            <td>${i}</td>
            <td>${ciudadano}</td>
            <td>${problema}</td>
            <td>${zona}</td>
            <td>27/05/2026</td>

            <td>

                <span class="estado ${estadoClase}">
                    ${estadoTexto}
                </span>

            </td>

            <td>

                <button class="btn btn-asignar btn-sm">

                    <i class="bi bi-person-check"></i>
                    Asignar

                </button>

            </td>

        </tr>

        `;

        tabla.innerHTML += fila;

    }

    // BOTON ASIGNAR

    document.addEventListener("click", function(e){

        if(e.target.closest(".btn-asignar")){

            let btn = e.target.closest(".btn-asignar");

            let fila = btn.closest("tr");

            let estado = fila.querySelector(".estado");

            // VALIDAR SI YA ESTA ASIGNADO

            if(estado.textContent.trim() !== "Asignado"){

                estado.textContent = "Asignado";

                estado.classList.remove("pendiente");

                estado.classList.add("asignado");

                asignados++;
                pendientes--;

                contadorAsignados.textContent = asignados;
                contadorPendientes.textContent = pendientes;

                alert("Reporte asignado correctamente.");

            }else{

                alert("Este reporte ya estaba asignado.");

            }

        }

    });

    // BUSCADOR

    const buscador = document.querySelector("input");

    buscador.addEventListener("keyup", function(){

        let texto = buscador.value.toLowerCase();

        document.querySelectorAll("tbody tr").forEach(function(fila){

            let contenido = fila.textContent.toLowerCase();

            if(contenido.includes(texto)){

                fila.style.display = "";

            }else{

                fila.style.display = "none";

            }

        });

    });

</script>

</body>

</html>
